<script>
"use strict";
const KEY = "sistema-personal-v1";
const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const ORDEN = [1,2,3,4,5,6,0];
const TABS = [["sentido","SENTIDO"],["semana","SEMANA"],["ideas","IDEAS"],["revision","REVISIÓN"],["datos","DATOS"]];
const SCHEMA_VERSION = 1;
const APP_ID = "sistema-personal";
const PREFIX = "sistema-personal"; // toda clave de localStorage de la app empieza así

const DEFAULT_DATA = {
  sentido:{
    vision:"Escribe aquí tu visión: ¿qué persona estás construyendo? ¿Qué vida conecta tus proyectos, tu estudio, la lectura y tus ideas?",
    areas:[
      {id:"a1", nombre:"Proyectos", proposito:"¿Por qué importan tus proyectos? Escríbelo en una frase que te recuerde la decisión que ya tomaste."},
      {id:"a2", nombre:"Estudio", proposito:"Ej: Estudio esto porque quiero habilidades escasas y valiosas que me den libertad."},
      {id:"a3", nombre:"Ideación", proposito:"Ej: Genero ideas cada semana porque mis proyectos futuros nacen de este espacio."},
      {id:"a4", nombre:"Lectura de sistemas", proposito:"Ej: Leo sobre sistemas porque quiero pensar mejor, no solo trabajar más."}
    ]
  },
  bloques:[
    {id:"b1", dia:1, hora:"07:00", area:"Estudio", dur:"60 min"},
    {id:"b2", dia:1, hora:"19:00", area:"Proyectos", dur:"90 min"},
    {id:"b3", dia:3, hora:"19:00", area:"Proyectos", dur:"90 min"},
    {id:"b4", dia:5, hora:"19:00", area:"Proyectos", dur:"90 min"},
    {id:"b5", dia:0, hora:"10:00", area:"Ideación", dur:"45 min"},
    {id:"b6", dia:0, hora:"18:00", area:"Revisión semanal", dur:"30 min"}
  ],
  ideas:[],
  revisiones:[]
};

let data;
try { data = JSON.parse(localStorage.getItem(KEY)) || structuredClone(DEFAULT_DATA); }
catch(e){ data = structuredClone(DEFAULT_DATA); }

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ console.error(e); }
  }, 300);
}
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => $("<i>").text(s ?? "").html().replace(/"/g,"&quot;");
const hoyISO = () => new Date().toISOString().slice(0,10);

let tab = "semana";

/* ---------- Vistas ---------- */
function viewSentido(){
  let h = `
  <div class="card">
    <p class="label">VISIÓN GENERAL</p>
    <textarea class="input" rows="4" data-bind="vision">${esc(data.sentido.vision)}</textarea>
  </div>`;
  $.each(data.sentido.areas, function(_, a){
    h += `
    <div class="card">
      <input class="input font-semibold mb-2" value="${esc(a.nombre)}" data-area="${a.id}" data-f="nombre">
      <textarea class="input" rows="3" data-area="${a.id}" data-f="proposito">${esc(a.proposito)}</textarea>
      <button class="btn mt-2 !text-[11px] del-area" data-id="${a.id}">Eliminar área</button>
    </div>`;
  });
  h += `<button class="btn" id="add-area">+ Añadir área</button>`;
  return h;
}

function viewSemana(){
  const hoy = new Date().getDay();
  let h = "";
  $.each(ORDEN, function(_, d){
    const bloques = data.bloques.filter(b => b.dia === d).sort((a,b) => a.hora.localeCompare(b.hora));
    h += `
    <div class="card ${hoy===d ? "!border-blanco" : ""}">
      <p class="label ${hoy===d ? "!text-blanco" : ""}">${DIAS[d].toUpperCase()}${hoy===d ? " · HOY" : ""}</p>
      ${bloques.length===0 ? `<p class="text-tenue text-sm">Sin bloques — día libre o de descanso.</p>` : ""}`;
    $.each(bloques, function(_, b){
      h += `
      <div class="flex gap-2 items-center mb-2 flex-wrap">
        <input type="time" class="input !w-[110px]" value="${esc(b.hora)}" data-bloque="${b.id}" data-f="hora">
        <input class="input flex-1 !w-auto min-w-[120px]" value="${esc(b.area)}" data-bloque="${b.id}" data-f="area">
        <input class="input !w-[90px]" value="${esc(b.dur)}" data-bloque="${b.id}" data-f="dur">
        <button class="btn !px-2.5 del-bloque" data-id="${b.id}">✕</button>
      </div>`;
    });
    h += `<button class="btn !text-[11px] add-bloque" data-dia="${d}">+ Bloque</button></div>`;
  });
  h += `<p class="text-gris text-sm">Regla: dentro de un bloque, lo demás no existe.</p>`;
  return h;
}

function viewIdeas(){
  let h = `
  <div class="card">
    <p class="label">CAPTURA RÁPIDA</p>
    <textarea class="input" rows="3" id="idea-nueva" placeholder="Idea para un proyecto nuevo o actual…"></textarea>
    <button class="btn btn-primary mt-2" id="add-idea">Guardar idea</button>
  </div>`;
  if(data.ideas.length === 0) h += `<p class="text-tenue text-sm">Aún no hay ideas. El bloque de ideación del domingo es tu momento.</p>`;
  $.each(data.ideas, function(_, i){
    h += `
    <div class="card flex gap-3 items-start">
      <div class="flex-1">
        <p class="font-mono text-[11px] text-gris">${esc(i.fecha)}</p>
        <p class="mt-1 leading-relaxed whitespace-pre-wrap">${esc(i.texto)}</p>
      </div>
      <button class="btn !px-2.5 del-idea" data-id="${i.id}">✕</button>
    </div>`;
  });
  return h;
}

function viewRevision(){
  let h = `
  <div class="card">
    <p class="label !text-blanco">REVISIÓN SEMANAL · 30 MIN</p>
    <p class="text-sm mb-1.5">¿Qué avancé esta semana?</p>
    <textarea class="input" rows="3" id="rev-avance"></textarea>
    <p class="text-sm mt-3 mb-1.5">¿Qué sigue la próxima semana?</p>
    <textarea class="input" rows="3" id="rev-siguiente"></textarea>
    <label class="flex gap-2 items-center mt-3 text-sm cursor-pointer">
      <input type="checkbox" id="rev-releido" class="w-4 h-4 accent-white"> Releí mi documento de sentido
    </label>
    <button class="btn btn-primary mt-3" id="add-revision">Guardar revisión</button>
  </div>`;
  $.each(data.revisiones, function(_, r){
    h += `
    <div class="card">
      <p class="font-mono text-[11px] text-gris">${esc(r.fecha)}${r.releido ? " · ✓ sentido releído" : ""}</p>
      ${r.avance ? `<p class="mt-1.5 text-sm"><span class="text-blanco font-semibold">Avancé:</span> <span class="text-gris">${esc(r.avance)}</span></p>` : ""}
      ${r.siguiente ? `<p class="mt-1 text-sm"><span class="text-blanco font-semibold">Sigue:</span> <span class="text-gris">${esc(r.siguiente)}</span></p>` : ""}
    </div>`;
  });
  return h;
}

function viewDatos(){
  return `
  <div class="card">
    <p class="label">PERSONALIZAR CON IA</p>
    <p class="text-gris text-sm mb-3 leading-relaxed">Copia un prompt con tu sistema actual y un enlace al contexto de la app (llms.txt). Pégalo en cualquier IA con acceso a internet, conversa las mejoras que quieras a tu sistema y te devolverá un JSON listo para importar aquí abajo.</p>
    <button class="btn btn-primary" id="prompt-ia">Copiar prompt para IA</button>
    <p id="ia-status" class="text-sm mt-2 font-mono"></p>
    <textarea id="ia-fallback" class="input mt-2 hidden" rows="6" readonly></textarea>
  </div>
  <div class="card">
    <p class="label">EXPORTAR</p>
    <p class="text-gris text-sm mb-3 leading-relaxed">Descarga una copia de seguridad con todos tus datos (sentido, semana, ideas y revisiones) en un archivo JSON. Guárdalo en un lugar seguro.</p>
    <button class="btn btn-primary" id="export-datos">Exportar copia</button>
  </div>
  <div class="card">
    <p class="label">IMPORTAR</p>
    <p class="text-gris text-sm mb-3 leading-relaxed">Restaura desde un archivo de copia previamente exportado. Podrás elegir entre reemplazar todo o fusionar con lo que ya tienes.</p>
    <input type="file" accept="application/json,.json" id="import-file" class="hidden">
    <button class="btn" id="import-datos">Elegir archivo…</button>
    <div id="import-preview" class="hidden mt-3 border-t border-linea pt-3"></div>
    <p id="datos-status" class="text-sm mt-3 font-mono whitespace-pre-wrap"></p>
  </div>`;
}

/* ---------- Export / Import ---------- */

// Migraciones: MIGRATIONS[v] transforma el objeto `data` de la versión v a la v+1.
// Hoy solo existe la v1, así que no hay migraciones. Cuando cambie el esquema:
// incrementar SCHEMA_VERSION y añadir MIGRATIONS[1] = (store) => { ...; return store; }.
const MIGRATIONS = {};

function migrar(store, desde){
  let v = desde;
  while(v < SCHEMA_VERSION){
    const fn = MIGRATIONS[v];
    if(typeof fn !== "function") throw new Error("Falta la migración de la versión " + v);
    store = fn(store);
    v++;
  }
  return store;
}

let pendingImport = null; // { store, schemaVersion } a la espera de confirmar reemplazar/fusionar

// Recopila todas las claves de localStorage de la app, con sus valores parseados como JSON.
function recopilarStore(){
  const store = {};
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(PREFIX) === 0){
      const raw = localStorage.getItem(k);
      try { store[k] = JSON.parse(raw); } catch(e){ store[k] = raw; }
    }
  }
  return store;
}

// Construye el objeto de backup (misma forma que el archivo de export).
function construirBackup(){
  return {
    app: APP_ID,
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    data: recopilarStore()
  };
}

// Copia texto al portapapeles con respaldo para contextos sin Clipboard API (p. ej. file://).
function copiarAlPortapapeles(texto){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(texto);
  }
  return new Promise(function(resolve, reject){
    try {
      const ta = document.createElement("textarea");
      ta.value = texto;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      ok ? resolve() : reject(new Error("execCommand"));
    } catch(e){ reject(e); }
  });
}

// Prompt para pegar en cualquier IA: enlace al llms.txt (contexto) + el sistema actual en JSON.
function construirPromptIA(){
  const llmsURL = new URL("./llms.txt", location.href).href;
  const backup = construirBackup();
  return 'Quiero personalizar mi app "Sistema Personal" (un sistema personal para ejecutar sin motivación).\n\n' +
    'Primero lee este archivo para entender qué es la app y el formato EXACTO de sus datos:\n' +
    llmsURL + '\n\n' +
    'Abajo está mi sistema actual, exportado en JSON. Ayúdame a mejorarlo: conversemos sobre mi visión, ' +
    'mis áreas, mis bloques semanales, mis ideas y mis revisiones (puedo cambiar mi esquema por completo). ' +
    'Cuando estemos de acuerdo, devuélveme UN ÚNICO bloque JSON válido para importar, con el mismo formato ' +
    '(campos app, schemaVersion, exportedAt y data) y el schemaVersion actual, listo para guardar como archivo ' +
    '.json e importar en la app.\n\n' +
    'Mi sistema actual:\n```json\n' + JSON.stringify(backup, null, 2) + '\n```';
}

function copiarPromptIA(){
  const prompt = construirPromptIA();
  copiarAlPortapapeles(prompt).then(function(){
    $("#ia-status").text("✓ Prompt copiado. Pégalo en tu IA favorita.");
    $("#ia-fallback").addClass("hidden");
  }).catch(function(){
    $("#ia-status").text("No se pudo copiar automáticamente. Copia el texto de abajo:");
    $("#ia-fallback").val(prompt).removeClass("hidden");
  });
}

function exportData(){
  const backup = construirBackup();
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `sistema-personal-backup-${hoyISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  $("#datos-status").text("✓ Copia exportada.");
}

// Cuenta elementos por sección del bloque principal (clave KEY) del store importado.
function resumenStore(store){
  const d = (store && store[KEY]) || {};
  const s = d.sentido || {};
  const otras = Object.keys(store || {}).filter(k => k !== KEY);
  return {
    vision: s.vision && String(s.vision).trim() ? 1 : 0,
    areas: Array.isArray(s.areas) ? s.areas.length : 0,
    bloques: Array.isArray(d.bloques) ? d.bloques.length : 0,
    ideas: Array.isArray(d.ideas) ? d.ideas.length : 0,
    revisiones: Array.isArray(d.revisiones) ? d.revisiones.length : 0,
    otras: otras
  };
}

function importData(ev){
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = ""; // permite reimportar el mismo archivo
  if(!file) return;
  const $s = $("#datos-status");
  const $prev = $("#import-preview").addClass("hidden").empty();
  pendingImport = null;
  const reader = new FileReader();
  reader.onload = function(){
    let backup;
    try { backup = JSON.parse(reader.result); }
    catch(e){ $s.text("✕ Archivo inválido: no es un JSON legible."); return; }
    if(!backup || typeof backup !== "object" || backup.app !== APP_ID){
      $s.text("✕ Este archivo no es una copia de Sistema Personal."); return;
    }
    const sv = backup.schemaVersion;
    if(typeof sv !== "number" || !Number.isInteger(sv) || sv < 1){
      $s.text("✕ La copia no declara un schemaVersion válido."); return;
    }
    if(sv > SCHEMA_VERSION){
      $s.text("✕ La copia usa una versión más nueva del formato (v" + sv + "). Actualiza la app."); return;
    }
    if(!backup.data || typeof backup.data !== "object"){
      $s.text("✕ La copia no contiene datos."); return;
    }
    let store;
    try { store = migrar(structuredClone(backup.data), sv); }
    catch(e){ $s.text("✕ No se pudo migrar la copia: " + e.message); return; }

    pendingImport = { store: store, schemaVersion: sv };
    const r = resumenStore(store);
    const extra = r.otras.length ? `\n· otras claves: ${r.otras.join(", ")}` : "";
    $prev.html(`
      <p class="text-sm mb-1">La copia contiene:</p>
      <p class="font-mono text-xs text-gris whitespace-pre-wrap">· visión: ${r.vision ? "sí" : "no"}
· áreas: ${r.areas}
· bloques: ${r.bloques}
· ideas: ${r.ideas}
· revisiones: ${r.revisiones}${extra}</p>
      <p class="text-sm mt-3 mb-2">¿Cómo quieres aplicarla?</p>
      <div class="flex gap-2 flex-wrap">
        <button class="btn btn-primary" id="import-replace">Reemplazar todo</button>
        <button class="btn" id="import-merge">Fusionar</button>
        <button class="btn" id="import-cancel">Cancelar</button>
      </div>
      <p class="text-tenue text-[11px] font-mono mt-2 leading-relaxed">Reemplazar borra tus datos actuales. Fusionar añade lo que falte; ante conflicto gana la copia.</p>`).removeClass("hidden");
    $s.text("");
  };
  reader.onerror = function(){ $s.text("✕ No se pudo leer el archivo."); };
  reader.readAsText(file);
}

// Fusiona dos arrays de objetos con `id`: parte del actual y la copia sobrescribe por id.
function fusionarPorId(actual, entrante){
  const map = new Map();
  (Array.isArray(actual) ? actual : []).forEach(x => { if(x && x.id != null) map.set(x.id, x); });
  (Array.isArray(entrante) ? entrante : []).forEach(x => { if(x && x.id != null) map.set(x.id, x); });
  return Array.from(map.values());
}

// Fusiona el bloque principal (KEY): arrays por id, la visión de la copia gana si no está vacía.
function fusionarPrincipal(actual, entrante){
  const out = structuredClone(actual && typeof actual === "object" ? actual : {});
  out.sentido = out.sentido && typeof out.sentido === "object" ? out.sentido : {};
  const eSent = (entrante && entrante.sentido) || {};
  if(typeof eSent.vision === "string" && eSent.vision.trim()) out.sentido.vision = eSent.vision;
  out.sentido.areas = fusionarPorId(out.sentido.areas, eSent.areas);
  out.bloques = fusionarPorId(out.bloques, entrante && entrante.bloques);
  out.ideas = fusionarPorId(out.ideas, entrante && entrante.ideas);
  out.revisiones = fusionarPorId(out.revisiones, entrante && entrante.revisiones);
  return out;
}

function aplicarImport(mode){
  if(!pendingImport){ return; }
  const store = pendingImport.store;
  const $s = $("#datos-status");
  try {
    if(mode === "replace"){
      const aBorrar = [];
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(PREFIX) === 0) aBorrar.push(k);
      }
      aBorrar.forEach(k => localStorage.removeItem(k));
      Object.keys(store).forEach(function(k){
        if(k.indexOf(PREFIX) !== 0) return;
        const v = store[k];
        localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
      });
    } else { // merge
      Object.keys(store).forEach(function(k){
        if(k.indexOf(PREFIX) !== 0) return;
        if(k === KEY){
          let cur;
          try { cur = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ cur = {}; }
          localStorage.setItem(KEY, JSON.stringify(fusionarPrincipal(cur, store[k])));
        } else {
          const v = store[k]; // la copia gana ante conflicto
          localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
        }
      });
    }
  } catch(e){ $s.text("✕ No se pudieron guardar los datos (¿almacenamiento lleno?)."); return; }

  try { data = JSON.parse(localStorage.getItem(KEY)) || structuredClone(DEFAULT_DATA); }
  catch(e){ data = structuredClone(DEFAULT_DATA); }
  pendingImport = null;
  render(); // re-dibuja la pestaña DATOS (limpia la previsualización)
  $("#datos-status").text(mode === "replace" ? "✓ Datos reemplazados correctamente." : "✓ Datos fusionados correctamente.");
}

/* ---------- Render ---------- */
function renderTabs(){
  const $t = $("#tabs").empty();
  $.each(TABS, function(_, t){
    $t.append(`<button class="tab-btn ${tab===t[0] ? "active" : ""}" data-tab="${t[0]}">${t[1]}</button>`);
  });
}
function render(){
  const views = { sentido: viewSentido, semana: viewSemana, ideas: viewIdeas, revision: viewRevision, datos: viewDatos };
  $("#main").html(views[tab]());
}

/* ---------- Eventos (delegación jQuery) ---------- */
$(function(){
  renderTabs();
  render();

  $("#tabs").on("click", ".tab-btn", function(){
    tab = $(this).data("tab");
    renderTabs(); render();
  });

  const $m = $("#main");

  // Sentido
  $m.on("input", "[data-bind='vision']", function(){ data.sentido.vision = this.value; save(); });
  $m.on("input", "[data-area]", function(){
    const a = data.sentido.areas.find(x => x.id === $(this).data("area"));
    if(a){ a[$(this).data("f")] = this.value; save(); }
  });
  $m.on("click", ".del-area", function(){
    data.sentido.areas = data.sentido.areas.filter(x => x.id !== $(this).data("id"));
    save(); render();
  });
  $m.on("click", "#add-area", function(){
    data.sentido.areas.push({id:uid(), nombre:"Nueva área", proposito:""});
    save(); render();
  });

  // Semana
  $m.on("input", "[data-bloque]", function(){
    const b = data.bloques.find(x => x.id === $(this).data("bloque"));
    if(b){ b[$(this).data("f")] = this.value; save(); }
  });
  $m.on("click", ".del-bloque", function(){
    data.bloques = data.bloques.filter(x => x.id !== $(this).data("id"));
    save(); render();
  });
  $m.on("click", ".add-bloque", function(){
    data.bloques.push({id:uid(), dia:$(this).data("dia"), hora:"19:00", area:"Proyecto", dur:"60 min"});
    save(); render();
  });

  // Ideas
  $m.on("click", "#add-idea", function(){
    const t = $("#idea-nueva").val().trim();
    if(!t) return;
    data.ideas.unshift({id:uid(), texto:t, fecha:hoyISO()});
    save(); render();
  });
  $m.on("click", ".del-idea", function(){
    data.ideas = data.ideas.filter(x => x.id !== $(this).data("id"));
    save(); render();
  });

  // Revisión
  $m.on("click", "#add-revision", function(){
    const avance = $("#rev-avance").val().trim();
    const siguiente = $("#rev-siguiente").val().trim();
    const releido = $("#rev-releido").is(":checked");
    if(!avance && !siguiente) return;
    data.revisiones.unshift({id:uid(), fecha:hoyISO(), avance, siguiente, releido});
    save(); render();
  });

  // Datos (export / import)
  $m.on("click", "#prompt-ia", copiarPromptIA);
  $m.on("click", "#export-datos", exportData);
  $m.on("click", "#import-datos", function(){ $("#import-file").trigger("click"); });
  $m.on("change", "#import-file", importData);
  $m.on("click", "#import-replace", function(){ aplicarImport("replace"); });
  $m.on("click", "#import-merge", function(){ aplicarImport("merge"); });
  $m.on("click", "#import-cancel", function(){
    pendingImport = null;
    $("#import-preview").addClass("hidden").empty();
    $("#datos-status").text("Importación cancelada.");
  });

  // Ancla
  $("#abrir-ancla").on("click", function(){
    $("#ancla-vision").text(data.sentido.vision);
    const $a = $("#ancla-areas").empty();
    $.each(data.sentido.areas, function(_, a){
      $a.append(`
        <div class="border-l-2 border-blanco pl-4">
          <p class="font-mono text-xs text-gris tracking-widest">${esc(a.nombre).toUpperCase()}</p>
          <p class="mt-1.5 leading-relaxed whitespace-pre-wrap">${esc(a.proposito)}</p>
        </div>`);
    });
    $("#ancla").removeClass("hidden");
  });
  $("#cerrar-ancla").on("click", function(){ $("#ancla").addClass("hidden"); });
});

/* Service worker */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
</script>
</body>
</html>
